<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAB - Painel Filiais</title>
    <link rel="stylesheet" href="../styles/matriz.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <span>CRAB</span>
        </div>
        <div class="info-usuario">
            <p>Bem-vindo(a), <strong id="strong_nome"></strong></p>
        </div>

        <nav class="menu">
            <a href="matriz.html" class="ativo"><i class="bi bi-speedometer2"></i> Painel Filiais</a>
            <a href="gerenciamento-Matriz.html"><i class="bi bi-gear"></i> Gerenciar Filiais</a>
            <a href="configuração.html"><i class="bi bi-gear"></i> Configurações</a>
            <a href="ajuda.html"><i class="bi bi-question-circle"></i> Ajuda</a>
        </nav>

        <div class="rodape-sidebar">
            <a href="../login.html">Sair <i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>

    <div class="conteudo-principal">

        <div class="cabecalho">
            <h1>Dashboard Geral</h1>
        </div>

        <div class="metricas-topo">
            <div class="cartao-alerta-principal">
                <span class="label">Lojas em alerta</span>
                <span class="valor" id="kpi-alerta">-/-</span>
            </div>
            <div class="cartao-stat stat-vermelho">
                <div class="stat-label">Saída abaixo<br>do ideal</div>
                <span class="stat-numero" id="kpi-vermelho">-</span>
            </div>
            <div class="cartao-stat stat-amarelo">
                <div class="stat-label">Estoque com<br>poucos produtos</div>
                <span class="stat-numero" id="kpi-amarelo">-</span>
            </div>
            <div class="cartao-stat stat-azul">
                <div class="stat-label">Lojas com<br>estoque estável</div>
                <span class="stat-numero" id="kpi-azul">-</span>
            </div>
        </div>

        <div class="painel-lojas">
            <h2>Lojas</h2>

            <div class="toolbar">
                <div class="filtros">
                    <button class="btn-filtro ativo" id="btn-todos"    onclick="filtrar('todos')">Todas</button>
                    <button class="btn-filtro"       id="btn-vermelho" onclick="filtrar('vermelho')">Em Alerta</button>
                    <button class="btn-filtro"       id="btn-amarelo"  onclick="filtrar('amarelo')">Atenção</button>
                    <button class="btn-filtro"       id="btn-azul"     onclick="filtrar('azul')">Estável</button>
                </div>

                <select title="Selecionar critério de ordenação" class="select-ordenar" id="select-ordenar" onchange="renderizar()">
                    <option value="padrao">Ordenar: Padrão</option>
                    <option value="nome">Ordenar: Nome</option>
                    <option value="entrada">Ordenar: Entrada</option>
                    <option value="saida">Ordenar: Saída</option>
                </select>
            </div>

            <div class="grid-filiais" id="grid-filiais"></div>
        </div>

    </div>

    <div class="envoltorio-config" id="envoltorio-filial">
        <div class="cartao-config">
            <div class="cabecalho-adduser">
                <i class="bi bi-building"></i>
                <h2 id="popup-titulo"></h2>
            </div>
            <div id="popup-corpo"></div>
            <div class="botoes-adduser">
                <button class="botao-adduser" onclick="fecharPopup()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        strong_nome.innerHTML = sessionStorage.getItem(`NOME_USUARIO`);

       let filiais = []

function carregarFiliais() {
    let idMatriz = sessionStorage.getItem('ID_MATRIZ')

    fetch(`/filial/listarFiliais/${idMatriz}`)
        .then(function(resposta) { return resposta.json() })
        .then(function(dados) {
    filiais = []

    for (let i = 0; i < dados.length; i++) {
        filiais.push({
            id_filial: dados[i].id_filial,
            nome:      dados[i].razao_social,
            status:    dados[i].status  || 'cinza',
            entrada:   dados[i].entrada || 0,
            saida:     dados[i].saida   || 0
        })
    }

    renderizar()
})
        .catch(function(erro) { console.log('ERRO:', erro) })
}

carregarFiliais()

        let statusLabel = { vermelho: 'Em Alerta', amarelo: 'Atenção', azul: 'Estável', cinza: 'Sem dados' }
        let prioridade  = { vermelho: 1, amarelo: 2, azul: 3, cinza: 4 }

        let filtroAtivo = 'todos'

        function atualizarKpis(lista) {
            let totalFiliais = 0
            let qtdVermelho  = 0
            let qtdAmarelo   = 0
            let qtdAzul      = 0

            for (let i = 0; i < lista.length; i++) {
                if (lista[i].status !== 'cinza') totalFiliais++
                if (lista[i].status === 'vermelho') qtdVermelho++
                if (lista[i].status === 'amarelo')  qtdAmarelo++
                if (lista[i].status === 'azul')     qtdAzul++
            }

            document.getElementById('kpi-alerta').innerText   = qtdVermelho + '/' + totalFiliais
            document.getElementById('kpi-vermelho').innerText  = qtdVermelho
            document.getElementById('kpi-amarelo').innerText   = qtdAmarelo
            document.getElementById('kpi-azul').innerText      = qtdAzul
        }

        function filtrar(tipo) {
            filtroAtivo = tipo

            let botoes = ['todos', 'vermelho', 'amarelo', 'azul']
            for (let i = 0; i < botoes.length; i++) {
                document.getElementById('btn-' + botoes[i]).classList.remove('ativo')
            }
            document.getElementById('btn-' + tipo).classList.add('ativo')

            renderizar()
        }

        function ordenar(lista) {
            let criterio = document.getElementById('select-ordenar').value
            let ordenada = []

            for (let i = 0; i < lista.length; i++) {
                ordenada.push(lista[i])
            }

            for (let i = 0; i < ordenada.length - 1; i++) {
                for (let j = 0; j < ordenada.length - 1 - i; j++) {
                    let trocar = false

                    if (criterio === 'padrao') {
                        trocar = prioridade[ordenada[j].status] > prioridade[ordenada[j + 1].status]
                    } else if (criterio === 'nome') {
                        trocar = ordenada[j].nome > ordenada[j + 1].nome
                    } else if (criterio === 'entrada') {
                        trocar = ordenada[j].entrada < ordenada[j + 1].entrada
                    } else if (criterio === 'saida') {
                        trocar = ordenada[j].saida < ordenada[j + 1].saida
                    }

                    if (trocar) {
                        let temp = ordenada[j]
                        ordenada[j] = ordenada[j + 1]
                        ordenada[j + 1] = temp
                    }
                }
            }

            return ordenada
        }

        function renderizar() {
            let lista = []

            if (filtroAtivo === 'todos') {
                lista = filiais
            } else {
                for (let i = 0; i < filiais.length; i++) {
                    if (filiais[i].status === filtroAtivo) {
                        lista.push(filiais[i])
                    }
                }
            }

            lista = ordenar(lista)
            atualizarKpis(filiais)
            renderizarGrid(lista)
        }

        function renderizarGrid(lista) {
            let grid = document.getElementById('grid-filiais')
            grid.innerHTML = ''

            for (let i = 0; i < lista.length; i++) {
                let f = lista[i]

                let clique    = ''
                let botaoInfo = ''

                if (f.id_filial === 1) {
                    clique    = 'clicavel" onclick="window.location.href=\'../dashboard2/dashboard.html?idFilial=' + f.id_filial + '\''
                    botaoInfo = '<button onclick="event.stopPropagation(); abrirPopup(' + f.id_filial + ')"><i class="bi bi-info-circle"></i></button>'
                }

                grid.innerHTML += '<div class="cartao-filial status-' + f.status + ' ' + clique + '">' +
                    '<div class="filial-header">' +
                        '<h3>' + f.nome + '</h3>' +
                        botaoInfo +
                    '</div>' +
                    '<div class="filial-body">' +
                        '<p>Entrada: <span>' + f.entrada + '%</span></p>' +
                        '<p>Saída: <span>' + f.saida + '%</span></p>' +
                    '</div>' +
                '</div>'
            }
        }

        function abrirPopup(id_filial) {
            let filial = null

            for (let i = 0; i < filiais.length; i++) {
                if (filiais[i].id_filial === id_filial) {
                    filial = filiais[i]
                }
            }

            if (!filial) return

            document.getElementById('popup-titulo').innerText = filial.nome
            document.getElementById('popup-corpo').innerHTML =
                '<p><strong>Status:</strong> '          + statusLabel[filial.status] + '</p>' +
                '<p><strong>Taxa de Entrada:</strong> ' + filial.entrada + '%</p>' +
                '<p><strong>Taxa de Saída:</strong> '   + filial.saida   + '%</p>'

            document.getElementById('envoltorio-filial').style.display = 'flex'
        }

        function fecharPopup() {
            document.getElementById('envoltorio-filial').style.display = 'none'
        }

        renderizar()

    </script>

</body>
</html>
