<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/matriz.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body onload="listarFiliais()">

    <div class="sidebar">
        <div class="logo">
            <span>CRAB</span>
        </div>
        <div class="info-usuario">
            <p>Bem-vindo(a), <strong>Usuário</strong></p>
        </div>

        <nav class="menu">
            <a href="../home.html"><i class="bi bi-house"></i> Início</a>
            <a href="matriz.html"><i class="bi bi-speedometer2"></i> Painel Filiais</a>
            <a href="gerenciamento-Matriz.html" class="ativo"><i class="bi bi-gear"></i> Gerenciar Filiais</a>
            <a href="ajuda.html"><i class="bi bi-question-circle"></i> Ajuda</a>
        </nav>

        <div class="rodape-sidebar">
            <a href="../login.html">Sair <i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>



    <section id="gerenciamento-filiais">
        <div class="cabecalho">
            <h1>Gerenciar Filiais</h1>

            <button onclick="abrirModal('modalFilial')">Adicionar Filial</button>
        </div>

        <div class="buscar">
            <input type="text" id="ipt_filial" placeholder="Buscar por nome">
        </div>


        <div class="filiais-container">
            <div class="cabecalho">
                <h3>Filial</h3>
                <h3>Açôes</h3>
            </div>

            <div class="card-filiais" id="div_filiais">


            </div>
        </div>




        <div class="envoltorio-config" id="modalFilial">
            <div class="cartao-config">
                <div class="cabecalho-adduser">
                    <i class="bi bi-person-plus-fill"></i>
                    <div>
                        <h2>Adicionar Nova Filial</h2>
                        <p>Cadastre uma nova filial ao seu sistema</p>

                    </div>
                </div>

                <div class="config-form">
                    <div class="campo">
                        <label for="nomeUsuario">Razão Social:</label>
                        <input type="text" id="ipt_razaoSocial" placeholder="Nome Filial"
                            oninput="validarRazaoSocial()">
                    </div>

                    <div class="campo">
                        <label for="novaSenha">Cnpj:</label>
                        <input type="text" id="ipt_cnpj" placeholder="00.000.000/0000-00" oninput="validarCPNJ()">
                    </div>

                    <div class="campo">
                        <label for="email">Cep:</label>
                        <input type="text" id="ipt_cep" placeholder="00000-000" oninput="validarCEP()">
                    </div>

                </div>
                <div class="botoes-adduser">

                    <button class="botao-adduser" onclick="fecharModal('modalFilial')">Voltar</button>
                    <button class="botao-adduser"
                        onclick="cadastrarFilial(),trocarModal('modalFilial', 'modalResponsavel')">Próximo</button>

                </div>
            </div>
        </div>



        <div class="envoltorio-config" id="modalResponsavel">
            <div class="cartao-config">
                <div class="cabecalho-adduser">
                    <i class="bi bi-person-plus-fill"></i>
                    <div>
                        <h2>Adicionar O Responsável</h2>
                        <p>Atribue um responsável pela sua Filial</p>

                    </div>
                </div>

                <div class="config-form">

                    <div class="campo">
                        <label>Tipo de responsável:</label>

                        <select id="select_tipo_responsavel" onchange="trocarTipoResponsavel()">
                            <option value="novo">Criar novo responsável</option>
                            <option value="existente">Usar responsável existente</option>
                        </select>
                    </div>

                    <div id="form-novo">
                    <div class="campo">
                        <label for="nomeUsuario">Nome Responsável:</label>
                        <input type="text" id="ipt_nome" placeholder="Responsavel">
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF Responsável:</label>
                        <input type="text" id="ipt_cpf" placeholder="000-000-000-00">
                    </div>

                    <div class="campo">
                        <label for="novaSenha">Email:</label>
                        <input type="email" id="ipt_email" placeholder="responvel@gmail.com">
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="ipt_senha" placeholder="********">
                    </div>
                </div>

                <div id="div_existente" style="display:none;">
                    <div class="campo">
                        <select id="select_responsavel"></select>
                    </div>
                </div>


                </div>
                <div class="botoes-adduser">

                    <button class="botao-adduser"
                        onclick="trocarModal('modalResponsavel', 'modalFilial')">Voltar</button>
                    <button class="botao-adduser" onclick="finalizarResponsavel()">Finalizar</button>

                </div>
            </div>
        </div>

    </section>









</body>

</html>
<script>
    function abrirModal(idModal) {
        document.getElementById(idModal).style.display = "flex"
    }

    function fecharModal(idModal) {
        document.getElementById(idModal).style.display = "none"
    }

    function trocarModal(fechar, abrir) {
        document.getElementById(fechar).style.display = "none"
        document.getElementById(abrir).style.display = "flex"
    }

    function validarRazaoSocial() {
        let empresa = ipt_razaoSocial.value;

        if (empresa.length >= 3) {
            validacaoEmpresa = true;

        } else {
            validacaoEmpresa = false;

        }
    }

    function validarCPNJ() {
        let cnpj = ipt_cnpj.value;

        if (cnpj.length == 18 && cnpj.includes(".") && cnpj.includes("/") && cnpj.includes("-")) {
            validacaoCNPJ = true;

        } else {
            validacaoCNPJ = false;

        }
    }

    function validarCEP() {
        let cep = ipt_cep.value;

        if (cep.length == 9 && cep.includes('-')) {
            validacaoCEP = true;

        } else {
            validacaoCEP = false;

        }
    }


    function cadastrarFilial() {

        let razaoSocial = ipt_razaoSocial.value
        let cpnj = ipt_cnpj.value
        let cep = ipt_cep.value
        let idMatriz = sessionStorage.getItem("ID_MATRIZ")

        console.log("ID_MATRIZ:", sessionStorage.getItem("ID_MATRIZ"));
        console.log("SESSION ID_MATRIZ:", sessionStorage.getItem("ID_MATRIZ"))

        fetch("/filial/cadastrarFilial", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                razaoSocialServer: razaoSocial,
                cnpjServer: cpnj,
                cepServer: cep,
                idMatrizServer: idMatriz
            })

        })

            .then(
                function (resposta) {
                    if (resposta.ok) {

                        resposta.json().then(function (json) {

                            console.log(json)

                            sessionStorage.setItem("ID_FILIAL_ATUAL", json.idFilial)

                            console.log(
                                "FILIAL CADASTRADA:",
                                sessionStorage.getItem("ID_FILIAL_ATUAL")
                            )
                        })


                    }
                }
            )

            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            }
            )
    }

    function finalizarResponsavel() {
        let tipo = document.getElementById("select_tipo_responsavel").value

        if (tipo == "novo") {
            cadastrarResponsavel()
        } else {
            vincularResponsavelExistente()
        }
    }

    function trocarTipoResponsavel() {

        let tipo = document.getElementById("select_tipo_responsavel").value

        if (tipo == "novo") {
            document.getElementById("form-novo").style.display = "block"
            document.getElementById("div_existente").style.display = "none"
        } else {
            document.getElementById("form-novo").style.display = "none"
            document.getElementById("div_existente").style.display = "block"

            carregarResponsaveis()
        }
    }
    
    function carregarResponsaveis() {

        let idMatriz = sessionStorage.getItem("ID_MATRIZ")


        fetch(`/filial/listarResponsaveis/${idMatriz}`)
        .then(res => res.json())
        .then(lista => {

            let select = document.getElementById("select_responsavel")

            select.innerHTML = `<option value="">Selecione</option>`

            lista.forEach(u => {
                select.innerHTML += `
                    <option value="${u.id_usuario}">
                        ${u.nome} - ${u.email}
                    </option>
                `;
        })
    })
}

function vincularResponsavelExistente() {

    let idUsuario = document.getElementById("select_responsavel").value
    let idFilial = sessionStorage.getItem("ID_FILIAL_ATUAL")
    let idMatriz = sessionStorage.getItem("ID_MATRIZ")

    if (!idUsuario) {
        alert("Selecione um responsável!")
        return;
    }

    if (!idFilial) {
        alert("Filial não encontrada. Recarregue o processo.")
        return;
    }

    fetch("/filial/vincularResponsavel", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        }, 
        body:JSON.stringify({
            idUsuarioServer: idUsuario,
            idFilialServer: idFilial,
            idMatrizServer: idMatriz
        })
    })

    .then(res => {
        if(res.ok) {
            alert("Responsável vinculado com sucesso!")
            fecharModal('modalResponsavel')
            listarFiliais()
        } else {
            alert("Erro ao vincular responsável no servidor")
        }
    })
    .catch(erro => {
        console.log("Erro de conexão:", erro)
        alert("Erro de conexão com o servidor")
    })
}



    function cadastrarResponsavel() {

        let nomeResponsavel = ipt_nome.value
        let cpfResponsavel = ipt_cpf.value
        let emailResponsavel = ipt_email.value
        let senhaResponsavel = ipt_senha.value

        fetch("/filial/cadastrarResponsavel", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeResponsavelServer: nomeResponsavel,
                cpfResponsavelServer: cpfResponsavel,
                emailResponsavelServer: emailResponsavel,
                senhaResponsavelServer: senhaResponsavel,
                idMatrizServer: sessionStorage.getItem("ID_MATRIZ"),
                idFilialServer: sessionStorage.getItem("ID_FILIAL_ATUAL")
            })
        })

            .then(
                function (resposta) {
                    if (resposta.ok) {
                        console.log("Responsavel cadastrado a filial")

                        fecharModal('modalResponsavel')

                        ipt_nome.value = ""
                        ipt_cpf.value = ""
                        ipt_email.value = ""
                        ipt_senha.value = ""

                    }
                }
            )

            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            })
    }

    function listarFiliais() {

        let idMatriz = sessionStorage.getItem("ID_MATRIZ")

        console.log("ID MATRIZ FRONT:", idMatriz);

        fetch(`/filial/listarFiliais/${idMatriz}`)
            .then(function (resposta) {
                console.log("Status:", resposta.status)

                return resposta.text();



            })

            .then(function (filiais) {



                filiais = JSON.parse(filiais)

                console.log("Dados recebidos:", filiais);

                div_filiais.innerHTML = ""

                for (let i = 0; i < filiais.length; i++) {

                    let filial = filiais[i]

                    div_filiais.innerHTML += `
                
                <div class= "filial"> 

                    <div class="sigla">
                        ${i + 1}
                    </div>

                <div class="texto-filial">
                    <h3>${filial.razao_social}</h3>
                    <p>${filial.email}</p>
                    <p>${filial.cnpj}</p>
                </div>

                <div class="acoes">
                    <div class="item">editar</div>
                    <div class="item">excluir</div>
                </div>

                </div>

                `
                }
            })

            .catch(function (erro) {
                console.log("ERRO:", erro);
            });
    }
</script>
