<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAB - Painel Filiais</title>
    <link rel="stylesheet" href="../styles/matriz.css">
    <link rel="stylesheet" href="../styles/dashboard-matriz.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>

        .cartao-filial {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .cartao-filial:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.15);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filtros { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn-filtro {
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }

        .btn-filtro:hover { border-color: #f17524; color: #f17524; }
        .btn-filtro.ativo { background: #0f172a; color: white; border-color: #0f172a; }

        .toolbar-direita { display: flex; align-items: center; gap: 10px; }

        .select-ordenar {
            padding: 6px 12px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 13px;
            color: #1e2937;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.2s;
        }

        .select-ordenar:focus { outline: none; border-color: #f17524; }

        .btns-vista { display: flex; gap: 4px; }

        .btn-vista {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            color: #64748b;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn-vista:hover { background: #f17524; color: white; border-color: #f17524; }
        .btn-vista.ativo { background: #0f172a; color: white; border-color: #0f172a; }

        .lista-filiais { display: none; }

        .lista-filiais table { width: 100%; border-collapse: collapse; }

        .lista-filiais th, .lista-filiais td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .lista-filiais th { color: #64748b; font-weight: 600; }
        .lista-filiais td { color: #1e2937; }

        .badge-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-vermelho { background: #fee2e2; color: #dc2626; }
        .badge-amarelo  { background: #fef3c7; color: #d97706; }
        .badge-azul     { background: #dbeafe; color: #2563eb; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <span>CRAB</span>
        </div>
        <div class="info-usuario">
            <p>Bem-vindo(a), <strong>Usuário</strong></p>
        </div>

        <nav class="menu">
            <a href="../home.html"><i class="bi bi-house"></i> Início</a>
            <a href="matriz.html" class="ativo"><i class="bi bi-speedometer2"></i> Painel Filiais</a>
            <a href="gerenciamento-Matriz.html"><i class="bi bi-gear"></i> Gerenciar Filiais</a>
            <a href="ajuda.html"><i class="bi bi-question-circle"></i> Ajuda</a>
        </nav>

        <div class="rodape-sidebar">
            <a href="../login.html">Sair <i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>

    <div class="conteudo-principal">

        <div class="cabecalho">
            <h1>Dashboard Geral</h1>
        </div>

        <div class="metricas-topo">
            <div class="cartao-alerta-principal">
                <span class="label">Lojas em alerta</span>
                <span class="valor">2/12</span>
            </div>
            <div class="cartao-stat stat-vermelho">
                <div class="stat-label">Saída abaixo<br>do ideal</div>
                <span class="stat-numero">2</span>
            </div>
            <div class="cartao-stat stat-amarelo">
                <div class="stat-label">Estoque com<br>poucos produtos</div>
                <span class="stat-numero">3</span>
            </div>
            <div class="cartao-stat stat-azul">
                <div class="stat-label">Lojas com<br>estoque estável</div>
                <span class="stat-numero">7</span>
            </div>
        </div>

        <div class="painel-lojas">
            <h2>Lojas</h2>

            <div class="toolbar">
                <div class="filtros">
                    <button class="btn-filtro ativo" id="btn-todos"    onclick="filtrar('todos')">Todas</button>
                    <button class="btn-filtro"       id="btn-vermelho" onclick="filtrar('vermelho')">🔴 Em Alerta</button>
                    <button class="btn-filtro"       id="btn-amarelo"  onclick="filtrar('amarelo')">🟡 Atenção</button>
                    <button class="btn-filtro"       id="btn-azul"     onclick="filtrar('azul')">🔵 Estável</button>
                </div>

                <div class="toolbar-direita">
                    <select class="select-ordenar" id="select-ordenar" onchange="renderizar()">
                        <option value="padrao">Ordenar: Padrão</option>
                        <option value="nome">Ordenar: Nome</option>
                        <option value="entrada">Ordenar: Entrada</option>
                        <option value="saida">Ordenar: Saída</option>
                    </select>

                    <div class="btns-vista">
                        <button class="btn-vista ativo" id="btn-grade" onclick="trocarVista('grade')" title="Grade">
                            <i class="bi bi-grid-3x3-gap"></i>
                        </button>
                        <button class="btn-vista" id="btn-lista" onclick="trocarVista('lista')" title="Lista">
                            <i class="bi bi-list-ul"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid-filiais" id="grid-filiais"></div>

            <div class="lista-filiais" id="lista-filiais">
                <table>
                    <thead>
                        <tr>
                            <th>Filial</th>
                            <th>Status</th>
                            <th>Entrada</th>
                            <th>Saída</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-lista"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="envoltorio-config" id="envoltorio-filial" onclick="fecharPopup()">
        <div class="cartao-config" onclick="event.stopPropagation()">
            <div class="cabecalho-adduser">
                <i class="bi bi-building" id="popup-icone"></i>
                <div>
                    <h2 id="popup-titulo"></h2>
                    <p style="color:#64748b; margin-top:4px; font-size:14px;">Endereço:</p>
                </div>
                <button onclick="fecharPopup()" style="margin-left:auto; background:none; border:none; font-size:20px; cursor:pointer; color:#94a3b8;">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div id="popup-corpo" style="display:flex; flex-direction:column; gap:14px; color:#1e2937; font-size:15px;"></div>
        </div>
    </div>

    <script>

        let filiais = [
            { id: 1, nome: 'Filial 1', status: 'vermelho', entrada: 83, saida: 22 },
            { id: 2, nome: 'Filial 2', status: 'amarelo',  entrada: 86, saida: 79 },
            { id: 3, nome: 'Filial 3', status: 'amarelo',  entrada: 80, saida: 61 },
            { id: 4, nome: 'Filial 4', status: 'amarelo',  entrada: 83, saida: 69 },
            { id: 5, nome: 'Filial 5', status: 'azul',     entrada: 90, saida: 65 },
            { id: 6, nome: 'Filial 6', status: 'azul',     entrada: 91, saida: 80 },
            { id: 7, nome: 'Filial 7', status: 'vermelho', entrada: 80, saida: 29 },
            { id: 8, nome: 'Filial 8', status: 'azul',     entrada: 88, saida: 82 },
        ]

        let statusLabel = { vermelho: 'Em Alerta', amarelo: 'Atenção', azul: 'Estável' }
        let badgeClasse = { vermelho: 'badge-vermelho', amarelo: 'badge-amarelo', azul: 'badge-azul' }
        let prioridade  = { vermelho: 1, amarelo: 2, azul: 3 }

        let filtroAtivo = 'todos'
        let vistaAtiva  = 'grade'

        function filtrar(tipo) {
            filtroAtivo = tipo

            let botoes = ['todos', 'vermelho', 'amarelo', 'azul']
            for (let i = 0; i < botoes.length; i++) {
                document.getElementById('btn-' + botoes[i]).classList.remove('ativo')
            }
            document.getElementById('btn-' + tipo).classList.add('ativo')

            renderizar()
        }

        function ordenar(lista) {
            let criterio = document.getElementById('select-ordenar').value
            let ordenada = []

            for (let i = 0; i < lista.length; i++) {
                ordenada.push(lista[i])
            }

            for (let i = 0; i < ordenada.length - 1; i++) {
                for (let j = 0; j < ordenada.length - 1 - i; j++) {
                    let trocar = false

                    if (criterio === 'padrao') {
                        trocar = prioridade[ordenada[j].status] > prioridade[ordenada[j + 1].status]
                    } else if (criterio === 'nome') {
                        trocar = ordenada[j].nome > ordenada[j + 1].nome
                    } else if (criterio === 'entrada') {
                        trocar = ordenada[j].entrada < ordenada[j + 1].entrada
                    } else if (criterio === 'saida') {
                        trocar = ordenada[j].saida < ordenada[j + 1].saida
                    }

                    if (trocar) {
                        let temp = ordenada[j]
                        ordenada[j] = ordenada[j + 1]
                        ordenada[j + 1] = temp
                    }
                }
            }

            return ordenada
        }

        function renderizar() {
            let lista = []

            if (filtroAtivo === 'todos') {
                lista = filiais
            } else {
                for (let i = 0; i < filiais.length; i++) {
                    if (filiais[i].status === filtroAtivo) {
                        lista.push(filiais[i])
                    }
                }
            }

            lista = ordenar(lista)

            renderizarGrid(lista)
            renderizarLista(lista)
        }

        function renderizarGrid(lista) {
            let grid = document.getElementById('grid-filiais')
            grid.innerHTML = ''

            for (let i = 0; i < lista.length; i++) {
                let f = lista[i]

                grid.innerHTML += `
                    <div class="cartao-filial status-${f.status}">
                        <div class="filial-header" style="display:flex; justify-content:space-between; align-items:center;">
                            <h3>${f.nome}</h3>
                            <button onclick="abrirPopup(${f.id})" style="background:none; border:none; cursor:pointer; font-size:18px; opacity:0.8;">
                                <i class="bi bi-info-circle"></i>
                            </button>
                        </div>
                        <div class="filial-body">
                            <p>Entrada: <span>${f.entrada}%</span></p>
                            <p>Saída: <span>${f.saida}%</span></p>
                        </div>
                    </div>
                `
            }
        }

        function renderizarLista(lista) {
            let tbody = document.getElementById('tbody-lista')
            tbody.innerHTML = ''

            for (let i = 0; i < lista.length; i++) {
                let f = lista[i]

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${f.nome}</strong></td>
                        <td><span class="badge-status ${badgeClasse[f.status]}">${statusLabel[f.status]}</span></td>
                        <td>${f.entrada}%</td>
                        <td>${f.saida}%</td>
                    </tr>
                `
            }
        }

        function trocarVista(modo) {
            vistaAtiva = modo

            document.getElementById('btn-grade').classList.remove('ativo')
            document.getElementById('btn-lista').classList.remove('ativo')
            document.getElementById('btn-' + modo).classList.add('ativo')

            if (modo === 'grade') {
                document.getElementById('grid-filiais').style.display = 'grid'
                document.getElementById('lista-filiais').style.display = 'none'
            } else {
                document.getElementById('grid-filiais').style.display = 'none'
                document.getElementById('lista-filiais').style.display = 'block'
            }
        }

        renderizar()

        function abrirPopup(id) {
            let filial = null

            for (let i = 0; i < filiais.length; i++) {
                if (filiais[i].id === id) {
                    filial = filiais[i]
                }
            }

            if (!filial) return

            document.getElementById('popup-titulo').innerText = filial.nome
            document.getElementById('popup-corpo').innerHTML = `
                <p><strong>Status:</strong> <span class="badge-status ${badgeClasse[filial.status]}">${statusLabel[filial.status]}</span></p>
                <p><strong>Taxa de Entrada:</strong> ${filial.entrada}%</p>
                <p><strong>Taxa de Saída:</strong> ${filial.saida}%</p>
            `

            document.getElementById('envoltorio-filial').style.display = 'flex'
        }

        function fecharPopup() {
            document.getElementById('envoltorio-filial').style.display = 'none'
        }

    </script>

</body>
</html>
