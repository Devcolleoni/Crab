<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAB - Painel Filiais</title>
    <link rel="stylesheet" href="../styles/matriz.css">
    <link rel="stylesheet" href="../styles/dashboard-matriz.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <span>CRAB</span>
        </div>
        <div class="info-usuario">
            <p>Bem-vindo(a), <strong>Usuário</strong></p>
        </div>

        <nav class="menu">
            <a href="../home.html"><i class="bi bi-house"></i> Início</a>
            <a href="matriz.html" class="ativo"><i class="bi bi-speedometer2"></i> Painel Filiais</a>
            <a href="gerenciamento-Matriz.html"><i class="bi bi-gear"></i> Gerenciar Filiais</a>
            <a href="ajuda.html"><i class="bi bi-question-circle"></i> Ajuda</a>
        </nav>

        <div class="rodape-sidebar">
            <a href="../login.html">Sair <i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>

    <div class="conteudo-principal">

        <div class="cabecalho">
            <h1>Dashboard Geral</h1>
        </div>

        <div class="metricas-topo">
            <div class="cartao-alerta-principal">
                <span class="label">Lojas em alerta</span>
                <span class="valor">2/12</span>
            </div>
            <div class="cartao-stat stat-vermelho">
                <div class="stat-label">Saída abaixo<br>do ideal</div>
                <span class="stat-numero">2</span>
            </div>
            <div class="cartao-stat stat-amarelo">
                <div class="stat-label">Estoque com<br>poucos produtos</div>
                <span class="stat-numero">3</span>
            </div>
            <div class="cartao-stat stat-azul">
                <div class="stat-label">Lojas com<br>estoque estável</div>
                <span class="stat-numero">7</span>
            </div>
        </div>

        <div class="painel-lojas">
            <h2>Lojas</h2>

            <div class="toolbar">
                <div class="filtros">
                    <button class="btn-filtro ativo" id="btn-todos"    onclick="filtrar('todos')">Todas</button>
                    <button class="btn-filtro"       id="btn-vermelho" onclick="filtrar('vermelho')">Em Alerta</button>
                    <button class="btn-filtro"       id="btn-amarelo"  onclick="filtrar('amarelo')">Atenção</button>
                    <button class="btn-filtro"       id="btn-azul"     onclick="filtrar('azul')">Estável</button>
                </div>

                <div class="toolbar-direita">
                    <select class="select-ordenar" id="select-ordenar" onchange="renderizar()">
                        <option value="padrao">Ordenar: Padrão</option>
                        <option value="nome">Ordenar: Nome</option>
                        <option value="entrada">Ordenar: Entrada</option>
                        <option value="saida">Ordenar: Saída</option>
                    </select>

                    <div class="btns-vista">
                        <button class="btn-vista ativo" id="btn-grade" onclick="trocarVista('grade')" title="Grade">
                            <i class="bi bi-grid-3x3-gap"></i>
                        </button>
                        <button class="btn-vista" id="btn-lista" onclick="trocarVista('lista')" title="Lista">
                            <i class="bi bi-list-ul"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid-filiais" id="grid-filiais"></div>

            <div class="lista-filiais" id="lista-filiais">
                <table>
                    <thead>
                        <tr>
                            <th>Filial</th>
                            <th>Status</th>
                            <th>Entrada</th>
                            <th>Saída</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-lista"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>

        let filiais = [
            { nome: 'Filial 1', status: 'vermelho', entrada: 83, saida: 22 },
            { nome: 'Filial 2', status: 'amarelo',  entrada: 86, saida: 79 },
            { nome: 'Filial 3', status: 'amarelo',  entrada: 80, saida: 61 },
            { nome: 'Filial 4', status: 'amarelo',  entrada: 83, saida: 69 },
            { nome: 'Filial 5', status: 'azul',     entrada: 90, saida: 65 },
            { nome: 'Filial 6', status: 'azul',     entrada: 91, saida: 80 },
            { nome: 'Filial 7', status: 'vermelho', entrada: 80, saida: 29 },
            { nome: 'Filial 8', status: 'azul',     entrada: 88, saida: 82 },
        ]

        let statusLabel = { vermelho: 'Em Alerta', amarelo: 'Atenção', azul: 'Estável' }
        let badgeClasse = { vermelho: 'badge-vermelho', amarelo: 'badge-amarelo', azul: 'badge-azul' }

        let filtroAtivo = 'todos'
        let vistaAtiva  = 'grade'

        function filtrar(tipo) {
            filtroAtivo = tipo

            let botoes = ['todos', 'vermelho', 'amarelo', 'azul']
            for (let i = 0; i < botoes.length; i++) {
                document.getElementById('btn-' + botoes[i]).classList.remove('ativo')
            }
            document.getElementById('btn-' + tipo).classList.add('ativo')

            renderizar()
        }

        function ordenar(lista) {
            let criterio = document.getElementById('select-ordenar').value
            let ordenada = []

            for (let i = 0; i < lista.length; i++) {
                ordenada.push(lista[i])
            }

            for (let i = 0; i < ordenada.length - 1; i++) {
                for (let j = 0; j < ordenada.length - 1 - i; j++) {
                    let trocar = false

                    if (criterio === 'nome') {
                        trocar = ordenada[j].nome > ordenada[j + 1].nome
                    } else if (criterio === 'entrada') {
                        trocar = ordenada[j].entrada < ordenada[j + 1].entrada
                    } else if (criterio === 'saida') {
                        trocar = ordenada[j].saida < ordenada[j + 1].saida
                    }

                    if (trocar) {
                        let temp = ordenada[j]
                        ordenada[j] = ordenada[j + 1]
                        ordenada[j + 1] = temp
                    }
                }
            }

            return ordenada
        }

        function renderizar() {
            let lista = []

            if (filtroAtivo === 'todos') {
                lista = filiais
            } else {
                for (let i = 0; i < filiais.length; i++) {
                    if (filiais[i].status === filtroAtivo) {
                        lista.push(filiais[i])
                    }
                }
            }

            lista = ordenar(lista)

            renderizarGrid(lista)
            renderizarLista(lista)
        }

        function renderizarGrid(lista) {
            let grid = document.getElementById('grid-filiais')
            grid.innerHTML = ''

            for (let i = 0; i < lista.length; i++) {
                let f = lista[i]

                grid.innerHTML += `
                    <div class="cartao-filial status-${f.status}">
                        <div class="filial-header">
                            <h3>${f.nome}</h3>
                        </div>
                        <div class="filial-body">
                            <p>Entrada: <span>${f.entrada}%</span></p>
                            <p>Saída: <span>${f.saida}%</span></p>
                        </div>
                    </div>
                `
            }
        }

        function renderizarLista(lista) {
            let tbody = document.getElementById('tbody-lista')
            tbody.innerHTML = ''

            for (let i = 0; i < lista.length; i++) {
                let f = lista[i]

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${f.nome}</strong></td>
                        <td><span class="badge-status ${badgeClasse[f.status]}">${statusLabel[f.status]}</span></td>
                        <td>${f.entrada}%</td>
                        <td>${f.saida}%</td>
                    </tr>
                `
            }
        }

        function trocarVista(modo) {
            vistaAtiva = modo

            document.getElementById('btn-grade').classList.remove('ativo')
            document.getElementById('btn-lista').classList.remove('ativo')
            document.getElementById('btn-' + modo).classList.add('ativo')

            if (modo === 'grade') {
                document.getElementById('grid-filiais').style.display = 'grid'
                document.getElementById('lista-filiais').style.display = 'none'
            } else {
                document.getElementById('grid-filiais').style.display = 'none'
                document.getElementById('lista-filiais').style.display = 'block'
            }
        }

        renderizar()

    </script>

</body>
</html>
